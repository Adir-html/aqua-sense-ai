# Render.com deployment configuration
# https://render.com/docs/blueprint-spec
# One-click deploy: https://render.com/deploy?repo=https://github.com/Adir-html/aqua-sense-ai

services:
  # ── API (FastAPI) ────────────────────────────────────────────────────────────
  - type: web
    name: aquasense-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aquasense-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false        # you set this in the Render dashboard
      - key: CORS_ORIGINS
        value: https://aquasense-web.onrender.com
    healthCheckPath: /health

  # ── Web (nginx static) ───────────────────────────────────────────────────────
  - type: web
    name: aquasense-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          name: aquasense-api
          type: web
          property: host

# ── Database ─────────────────────────────────────────────────────────────────
databases:
  - name: aquasense-db
    plan: free
    databaseName: aquasense
    user: aqua
