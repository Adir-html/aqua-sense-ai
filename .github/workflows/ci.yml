name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER:     aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB:       aquasense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aquasense

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-cov python-dotenv

      - name: Run unit tests
        working-directory: apps/api
        run: pytest tests/test_analyze.py tests/test_analyze_integration.py -v --tb=short

      - name: Run DB integration tests
        run: pytest apps/api/tests/test_database_integration.py -v --tb=short

      - name: Check import health
        run: |
          python -c "from src.api.inference_router import router; print('router OK')"
          python -c "from src.ai.openrouter_vision import analyze; print('openrouter OK')"
